<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src blob:; connect-src 'self' https://api.github.com http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Proofboard: study plan and proof</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>Proofboard</h1>
    <span class="savestate" id="syncStatus" role="status" aria-live="polite"></span>
    <button class="btn primary" type="button" data-act="newproof" id="addProofTop" hidden>Add proof</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections" hidden>
    <button class="tab" role="tab" data-tab="today">Today</button>
    <button class="tab" role="tab" data-tab="plan">Plan</button>
    <button class="tab" role="tab" data-tab="log">Daily log</button>
    <button class="tab" role="tab" data-tab="skills">Skills and proof</button>
    <button class="tab" role="tab" data-tab="library">Proof library</button>
    <button class="tab" role="tab" data-tab="schedule">Schedule</button>
  </nav>
</header>
<main class="wrap">
  <p class="notice" id="loading">Loading…</p>
  <div class="notice" id="rejected" hidden></div>
  <section class="panel" id="p-setup" hidden></section>
  <section class="panel" id="p-today" role="tabpanel" hidden></section>
  <section class="panel" id="p-plan" role="tabpanel" hidden></section>
  <section class="panel" id="p-log" role="tabpanel" hidden></section>
  <section class="panel" id="p-skills" role="tabpanel" hidden></section>
  <section class="panel" id="p-library" role="tabpanel" hidden></section>
  <section class="panel" id="p-schedule" role="tabpanel" hidden></section>
  <div class="tools" id="tools" hidden>
    <p class="muted">Every change is saved as a commit in your private data repository. Changes made without a connection stay on this device and are saved when it comes back.</p>
    <div class="row">
      <button class="btn small" type="button" data-act="export">Download a full export (JSON)</button>
      <button class="btn small danger" type="button" data-act="forget">Forget this device</button>
    </div>
  </div>
</main>

<dialog id="proofDlg" aria-labelledby="proofDlgTitle">
  <form method="dialog" id="proofForm" novalidate>
    <div class="dlg-head"><h2 id="proofDlgTitle">Add proof</h2><button class="btn small" type="button" data-act="dlgclose">Close</button></div>
    <div class="dlg-body" id="proofBody"></div>
    <div class="dlg-foot" id="proofFoot"></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
